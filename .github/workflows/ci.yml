name: Build checks

on:
  push:
  pull_request:

jobs:
  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python source
        run: python -m compileall -q backend/app
      - name: Install lightweight test dependencies
        run: python -m pip install "sqlalchemy>=2.0,<3" "pydantic-settings>=2,<3"
      - name: Run backend unit tests
        env:
          DATABASE_URL: "sqlite:///:memory:"
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -p "test_*.py" -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
